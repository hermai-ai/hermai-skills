<!doctype html>
<html>
<head>
<style>
  :root {
    --hermai-brand: #111827;
    --hermai-on-brand: #ffffff;
    --hermai-text-accent: #111827;
    --hermai-tint: #f5f5f4;
    --hermai-border: #d4d4d4;
    --hermai-focus: #2563eb;
    --hermai-data-primary: #111827;
  }
  .id-strip .hermai-logo-image { max-height: 18px; max-width: 110px; }
  .brand-mark .hermai-logo-image { max-height: 20px; max-width: 120px; }
  .dark-identity .hermai-logo-image { max-height: 16px; max-width: 100px; }
</style>
</head>
<body>
  <div class="id-strip">
    <span data-hermai-logo>{{HERMAI_LOGO_COMPACT}}</span>
  </div>
  <span class="brand-mark">
    <span data-hermai-logo>{{HERMAI_LOGO_STANDARD}}</span>
  </span>
  <div class="dark-identity">
    <span data-hermai-logo>{{HERMAI_LOGO_ON_DARK}}</span>
  </div>
  <span data-hermai-company>{{HERMAI_COMPANY_NAME}}</span>
</body>
</html>
